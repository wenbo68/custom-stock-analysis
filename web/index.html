<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = 'theme';
        const root = document.documentElement;
        // Paint the right scheme before the app loads so a light-mode
        // visitor never sees a dark flash: a saved pick wins, "system"
        // follows the OS, and no pick at all means the app's default (dark).
        const storedTheme = localStorage.getItem(storageKey);
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : storedTheme === 'system'
              ? systemTheme
              : 'dark';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <title>Custom Stock Analysis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
